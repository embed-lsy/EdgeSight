<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img"
     aria-label="俯仰角的作用：镜头压低能看更近，但会把远处地面挤出画面；精度几乎不随俯仰角变化">
  <defs>
    <style>
      .t   { font-family: "Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif; }
      .ttl { font-size:13.5px; font-weight:700; fill:#1f2d3d; }
      .sub { font-size:11px; fill:#6b7a8d; }
      .lbl { font-size:11px; fill:#5a6a7d; }
      .val { font-size:11px; font-weight:700; fill:#1f2d3d; }
      .tk  { font-size:9.5px; fill:#8b97a5; }
      .mark{ font-size:10px; font-weight:700; }
      .note{ font-size:10.5px; fill:#7b8898; }
      .gnd { stroke:#8d9bad; stroke-width:1.6; }
      .cone{ fill:#3f7fbf; fill-opacity:.13; stroke:#3f7fbf; stroke-width:1.6; }
      .cone2{ fill:#b3452f; fill-opacity:.10; stroke:#b3452f; stroke-width:1.6; stroke-dasharray="6 4"; }
      .pl  { fill:#fcfdfe; stroke:#c9d3de; stroke-width:1; }
      .gd  { stroke:#e9eef4; stroke-width:1; }
      .axl { stroke:#b6c2d0; stroke-width:1.2; }
    </style>
  </defs>

  <rect width="940" height="420" fill="#ffffff"/>
  <text class="t ttl" x="20" y="26">俯仰角 θ 管的是「看多近 / 看多远」，不是精度</text>
  <text class="t sub" x="20" y="44">左：镜头压低（θ 变大）时光锥整体下移 —— 近端更近，但远处的地面被挤出画面。右：H=1.0 m 时θ 与最近可测距离的关系。</text>

  <!-- ============ 左：侧视几何 ============ -->
  <g transform="translate(0,0)">
    <!-- 地面 -->
    <line class="gnd" x1="20" y1="330" x2="560" y2="330"/>
    <g stroke="#dde3ea" stroke-width="1">
      <line x1="20" y1="336" x2="560" y2="336"/>
    </g>
    <!-- 地面刻度（1 m = 60 px，相机在 x=70） -->
    <g class="t tk" text-anchor="middle">
      <text x="130" y="356">1 m</text><text x="190" y="356">2 m</text><text x="250" y="356">3 m</text>
      <text x="370" y="356">5 m</text><text x="490" y="356">7 m</text>
    </g>
    <g stroke="#c3cdd9" stroke-width="1">
      <line x1="130" y1="330" x2="130" y2="338"/><line x1="190" y1="330" x2="190" y2="338"/>
      <line x1="250" y1="330" x2="250" y2="338"/><line x1="370" y1="330" x2="370" y2="338"/>
      <line x1="490" y1="330" x2="490" y2="338"/>
    </g>

    <!-- θ=8° 光锥（浅）：下边界 25° → 2.14 m；上边界 −9° → 射向地平线 -->
    <path class="cone" d="M70,270 L198,330 L556,176 L70,270 Z"/>
    <line x1="70" y1="270" x2="300" y2="308" stroke="#3f7fbf" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text class="t mark" x="308" y="306" fill="#3f7fbf">光轴 θ = 8°</text>
    <text class="t mark" x="520" y="172" fill="#3f7fbf">→ 地平线</text>

    <!-- θ=25° 光锥（虚线）：下边界 42° → 1.11 m；上边界 8° → 7.12 m -->
    <path class="cone2" d="M70,270 L137,330 L497,330 L70,270 Z"/>
    <line x1="70" y1="270" x2="330" y2="352" stroke="#b3452f" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text class="t mark" x="338" y="368" fill="#b3452f">光轴 θ = 25°</text>

    <!-- 相机本体（H = 1.0 m） -->
    <rect x="56" y="256" width="28" height="18" rx="3" fill="#46536b"/>
    <path d="M84,262 l14,-6 l0,12 z" fill="#46536b"/>
    <line x1="70" y1="274" x2="70" y2="330" stroke="#8d9bad" stroke-width="1" stroke-dasharray="3 3"/>
    <text class="t lbl" x="24" y="300">H = 1.0 m</text>
    <text class="t lbl" x="24" y="316">（相机高度）</text>

    <!-- 两个近端点 -->
    <circle cx="198" cy="330" r="4" fill="#3f7fbf"/>
    <text class="t val" x="204" y="326" fill="#3f7fbf">最近可测 2.14 m</text>
    <circle cx="137" cy="330" r="4" fill="#b3452f"/>
    <text class="t val" x="60" y="346" fill="#b3452f">压低后最近 1.11 m</text>
    <circle cx="497" cy="330" r="4" fill="#b3452f"/>
    <text class="t val" x="470" y="316" fill="#b3452f">最远只到 7.1 m</text>

    <text class="t lbl" x="20" y="392">镜头压低 → 看得更近，但远处的地面被挤出画面。</text>
  </g>

  <!-- ============ 右：θ → 最近可测距离 ============ -->
  <text class="t ttl" x="600" y="70">θ 与「最近可测距离」（H = 1.0 m）</text>
  <rect class="pl" x="620" y="90" width="280" height="240"/>
  <g class="gd">
    <line x1="620" y1="137" x2="900" y2="137"/><line x1="620" y1="183" x2="900" y2="183"/>
    <line x1="620" y1="230" x2="900" y2="230"/><line x1="620" y1="276" x2="900" y2="276"/>
  </g>
  <g class="axl"><line x1="620" y1="90" x2="620" y2="330"/><line x1="620" y1="330" x2="900" y2="330"/></g>
  <g class="t tk" text-anchor="end">
    <text x="612" y="334">0</text><text x="612" y="281">1 m</text><text x="612" y="227">2 m</text>
    <text x="612" y="174">3 m</text><text x="612" y="120">4 m</text>
  </g>
  <g class="t tk" text-anchor="middle">
    <text x="620" y="348">0°</text><text x="713" y="348">10°</text><text x="807" y="348">20°</text><text x="900" y="348">30°</text>
  </g>
  <text class="t tk" x="760" y="370" text-anchor="middle">俯仰角 θ</text>

  <line x1="754" y1="90" x2="754" y2="330" stroke="#4a9160" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="t mark" x="758" y="106" fill="#2f7d4f">推荐 14.4°</text>
  <line x1="806" y1="90" x2="806" y2="330" stroke="#c07a2a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="t mark" x="802" y="130" fill="#a06a24" text-anchor="end">19.9° 起地平线出画</text>

  <polyline fill="none" stroke="#3f7fbf" stroke-width="2.4"
    points="620,116 667,175 713,210 760,234 807,251 853,264 900,275"/>
  <g fill="#3f7fbf">
    <circle cx="620" cy="116" r="3"/><circle cx="713" cy="210" r="3"/>
    <circle cx="807" cy="251" r="3"/><circle cx="900" cy="275" r="3"/>
  </g>
  <text class="t tk" x="628" y="112" fill="#3f7fbf">4.0 m</text>
  <text class="t tk" x="718" y="206" fill="#3f7fbf">2.25 m</text>
  <text class="t tk" x="812" y="247" fill="#3f7fbf">1.48 m</text>
  <text class="t tk" x="868" y="271" fill="#3f7fbf">1.04 m</text>

  <rect x="600" y="384" width="320" height="30" rx="4" fill="#f2f6fa" stroke="#cfd9e4"/>
  <text class="t note" x="610" y="398">注意：调 θ 几乎不提升精度（13° → 25° 只差约 0.1%），</text>
  <text class="t note" x="610" y="411">它换的是视野位置 —— 别为了「更准」把镜头压过头。</text>
</svg>
