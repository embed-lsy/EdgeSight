<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 740" width="940" height="740" role="img"
     aria-label="EdgeSight 设置页界面示意图：模型配置、检测配置、标定与系统、指纹档案管理">
  <defs>
    <style>
      .t   { font-family: "Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif; }
      .win { fill:#f4f7fa; stroke:#8d9bad; stroke-width:1.2; }
      .tbt { font-size:12.5px; fill:#9aa7b8; }
      .tba { font-size:12.5px; font-weight:700; fill:#1f2d3d; }
      .grp { fill:#fbfcfe; stroke:#a9b6c6; stroke-width:1.1; }
      .gt  { font-size:12px; font-weight:700; fill:#2b3a4d; }
      .lbl { font-size:11.5px; fill:#5a6a7d; }
      .val { font-size:12px; font-weight:700; fill:#1f2d3d; }
      .btn { font-size:11.5px; fill:#2b3a4d; }
      .sm  { font-size:10.5px; fill:#7b8898; }
      .hint{ font-size:10px; fill:#7b8898; }
      .box { fill:#ffffff; stroke:#b6c2d0; stroke-width:1; }
      .lst { fill:#ffffff; stroke:#b6c2d0; stroke-width:1; }
      .row { fill:#eef4fb; }
      .scr { fill:#e6ebf2; }
      .hnd { fill:#4a5568; }
    </style>
  </defs>

  <rect width="940" height="740" fill="#ffffff"/>

  <rect class="win" x="8" y="8" width="924" height="684" rx="6"/>
  <path fill="#3a4050" d="M8,14 a6,6 0 0 1 6,-6 h912 a6,6 0 0 1 6,6 v24 h-924 z"/>
  <text class="t" x="26" y="30" font-size="12.5" font-weight="700" fill="#dfe6ef">EdgeSight · 单目视觉感知栈</text>
  <g fill="#5c6879">
    <circle cx="888" cy="26" r="4"/><circle cx="903" cy="26" r="4"/><circle cx="918" cy="26" r="4"/>
  </g>

  <g class="t tbt">
    <text x="34" y="63">监视</text>
    <text x="142" y="63">深度分析</text>
    <text x="396" y="63">录制回放</text>
    <text x="506" y="63">标定</text>
  </g>
  <rect x="200" y="46" width="64" height="26" rx="4" fill="#ffffff" stroke="#a9b6c6"/>
  <text class="t tba" x="232" y="63" text-anchor="middle">设置</text>
  <line x1="20" y1="72" x2="920" y2="72" stroke="#c3cdd9" stroke-width="1"/>

  <!-- 模型配置 -->
  <rect class="grp" x="20" y="86" width="872" height="124" rx="4"/>
  <rect x="30" y="78" width="72" height="16" fill="#fbfcfe"/>
  <text class="t gt" x="34" y="90">模型配置</text>
  <g class="t">
    <text class="lbl" x="34" y="116">模型文件：</text>
    <rect class="box" x="106" y="102" width="56" height="20" rx="4"/>
    <text class="btn" x="134" y="116" text-anchor="middle">浏览</text>
    <text class="lbl" x="182" y="116">当前模型：</text>
    <text class="val" x="266" y="116">yolov8n.onnx</text>

    <text class="lbl" x="34" y="154">标签文件：</text>
    <rect class="box" x="106" y="140" width="56" height="20" rx="4"/>
    <text class="btn" x="134" y="154" text-anchor="middle">浏览</text>
    <text class="lbl" x="182" y="154">当前标签：</text>
    <text class="val" x="266" y="154">coco80.txt</text>

    <text class="lbl" x="34" y="192">硬件加速器：</text>
    <rect class="box" x="124" y="178" width="120" height="20" rx="4"/>
    <text class="btn" x="134" y="192">CPU</text>
    <path d="M230,186 l6,6 l6,-6" fill="none" stroke="#5a6a7d" stroke-width="1.4"/>
  </g>

  <!-- 检测配置 -->
  <rect class="grp" x="20" y="222" width="872" height="100" rx="4"/>
  <rect x="30" y="214" width="72" height="16" fill="#fbfcfe"/>
  <text class="t gt" x="34" y="226">检测配置</text>
  <g class="t">
    <text class="lbl" x="34" y="252">追踪目标选择：</text>
    <rect class="box" x="130" y="238" width="180" height="20" rx="4"/>
    <text class="btn" x="140" y="252">目标 A</text>
    <path d="M296,246 l6,6 l6,-6" fill="none" stroke="#5a6a7d" stroke-width="1.4"/>
    <rect class="box" x="326" y="238" width="76" height="20" rx="4"/>
    <text class="btn" x="364" y="252" text-anchor="middle">重命名…</text>

    <text class="lbl" x="34" y="292">基准宽度：</text>
    <rect x="106" y="286" width="240" height="6" rx="3" fill="#dbe3ec"/>
    <rect x="106" y="286" width="72" height="6" rx="3" fill="#3f7fbf"/>
    <circle cx="178" cy="289" r="7" fill="#ffffff" stroke="#3f7fbf" stroke-width="2"/>
    <text class="val" x="362" y="292">30</text>
  </g>

  <!-- 标定与系统 -->
  <rect class="grp" x="20" y="334" width="872" height="124" rx="4"/>
  <rect x="30" y="326" width="88" height="16" fill="#fbfcfe"/>
  <text class="t gt" x="34" y="338">标定与系统</text>
  <g class="t">
    <text class="lbl" x="34" y="364">采样频率（Hz）：</text>
    <rect x="146" y="358" width="240" height="6" rx="3" fill="#dbe3ec"/>
    <rect x="146" y="358" width="72" height="6" rx="3" fill="#3f7fbf"/>
    <circle cx="218" cy="361" r="7" fill="#ffffff" stroke="#3f7fbf" stroke-width="2"/>
    <text class="val" x="402" y="364">30Hz</text>

    <rect class="box" x="34" y="384" width="14" height="14" rx="7" fill="#3f7fbf" stroke="#58a6ff"/>
    <path d="M38,394 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text class="lbl" x="56" y="396">是否启用深度分析</text>

    <rect class="box" x="34" y="424" width="88" height="24" rx="4"/>
    <text class="btn" x="78" y="440" text-anchor="middle">应用参数</text>
    <text class="lbl" x="140" y="440">标定状态：</text>
    <text class="val" x="222" y="440">已标定</text>
  </g>

  <!-- 指纹档案管理 -->
  <rect class="grp" x="20" y="470" width="872" height="198" rx="4"/>
  <rect x="30" y="462" width="196" height="16" fill="#fbfcfe"/>
  <text class="t gt" x="34" y="474">指纹档案管理（查 / 改 / 删）</text>
  <text class="t hint" x="34" y="494">建档在「标定」页第三步。这里管已建的档：选中一条可以改名或删除。删除会立刻写盘、不可撤销；若删的正是追踪目标，追踪目标会同时被取消。</text>
  <rect class="lst" x="32" y="506" width="852" height="84"/>
  <rect class="row" x="33" y="507" width="850" height="27"/>
  <g class="t btn">
    <text x="42" y="526">目标 A · 框跨度 1.42 m · 样本 12 帧</text>
    <text x="42" y="554">目标 B · 框跨度 1.38 m · 样本 10 帧</text>
    <text x="42" y="582">目标 C · 框跨度 1.45 m · 样本 11 帧</text>
  </g>
  <g class="t">
    <rect class="box" x="32" y="608" width="72" height="24" rx="4"/>
    <text class="btn" x="68" y="624" text-anchor="middle">改名…</text>
    <rect class="box" x="112" y="608" width="72" height="24" rx="4"/>
    <text class="btn" x="148" y="624" text-anchor="middle">删除</text>
    <rect class="box" x="192" y="608" width="90" height="24" rx="4"/>
    <text class="btn" x="237" y="624" text-anchor="middle">刷新列表</text>
    <text class="hint" x="34" y="656">来源：③ 指纹建档 · 样本 12 帧 · 外观嵌入：已生成（512 维）· 建档于 2026-10-03</text>
  </g>

  <!-- 滚动条 -->
  <rect class="scr" x="898" y="86" width="14" height="582" rx="7"/>
  <rect class="hnd" x="901" y="100" width="8" height="190" rx="4"/>

  <text class="t sm" x="20" y="712">示意图：分组标题、控件文案与提示原文取自 ui/EdgeSightMain.ui；模型与标签为当前 settings.json 的实际取值。</text>
  <text class="t sm" x="20" y="730">档案名用显示名（非内部 ID）；样本数、框跨度与建档时间为示例值。</text>
</svg>
